  <g filter="url(#sh)" transform="translate(317 48)"><rect width="566" height="464" rx="24" fill="#f1eee6"/><rect width="566" height="60" rx="24" fill="#e7e4da"/><path d="M0 38h566v22H0z" fill="#e7e4da"/><circle cx="28" cy="30" r="5" fill="#fb7c52"/><circle cx="47" cy="30" r="5" fill="#d4f265"/><circle cx="66" cy="30" r="5" fill="#9da48a"/><text x="100" y="36" fill="#41443a" font-family="monospace" font-size="12">STUDYMATE / YOUR SPACE</text><rect x="23" y="83" width="32" height="32" rx="10" fill="#d4f265"/><path d="M33 99h13M39.5 92v14" stroke="#303625" stroke-width="2"/><text x="69" y="103" fill="#282a23" font-family="Arial,sans-serif" font-size="23" font-weight="700">Good evening, Anjali</text><text x="24" y="135" fill="#77796f" font-family="Arial,sans-serif" font-size="12">A little progress still counts as progress.</text>
  <rect x="23" y="157" width="250" height="105" rx="15" fill="#262923"/><text x="42" y="184" fill="#d4f265" font-family="monospace" font-size="10" letter-spacing="1">NEXT EXAM</text><text x="42" y="221" fill="#f1eee6" font-family="Arial,sans-serif" font-size="22" font-weight="700">Data Structures</text><text x="42" y="244" fill="#b8b9ad" font-family="Arial,sans-serif" font-size="12">12 days to go · You’ve got this.</text><rect x="289" y="157" width="254" height="105" rx="15" fill="#e4e9d3"/><text x="309" y="184" fill="#747b5e" font-family="monospace" font-size="10" letter-spacing="1">AI STUDY PLAN</text><text x="309" y="211" fill="#32372b" font-family="Arial,sans-serif" font-size="15" font-weight="700">A realistic plan,</text><text x="309" y="232" fill="#32372b" font-family="Arial,sans-serif" font-size="15" font-weight="700">made for your week.</text><rect x="309" y="241" width="106" height="5" rx="2" fill="#d4f265"/>
