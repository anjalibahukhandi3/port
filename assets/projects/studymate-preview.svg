<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">EduBot StudyMate AI project preview</title><desc id="desc">Illustrative study planner interface with exam countdown, AI study plan, daily tasks, and Pomodoro focus timer.</desc>
