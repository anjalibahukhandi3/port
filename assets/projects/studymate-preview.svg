  <text x="77" y="223" fill="#d4f265" font-family="monospace" font-size="12" letter-spacing="3">PROJECT PREVIEW / 02</text><text x="77" y="273" fill="#f1eee6" font-family="Arial,sans-serif" font-size="35" font-weight="700">Study smarter,</text><text x="77" y="316" fill="#f1eee6" font-family="Arial,sans-serif" font-size="35" font-weight="700">leave room to breathe.</text><text x="77" y="365" fill="#c2c6b9" font-family="Arial,sans-serif" font-size="15">Concept UI based on the real app features</text><text x="77" y="390" fill="#c2c6b9" font-family="Arial,sans-serif" font-size="15">documented in the EduBot repository.</text>
